# Blueprint de Render para el CMS: crea el servicio y su Postgres de una vez.
# Uso: Render → New → Blueprint → apuntar a este repositorio.
services:
  - type: web
    name: bmc-cms
    runtime: docker
    dockerfilePath: ./apps/cms/Dockerfile
    dockerContext: ./apps/cms
    plan: free
    region: oregon
    healthCheckPath: /_health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 1337

      # Secretos generados por Render; no hay que copiarlos a ningún sitio
      - key: APP_KEYS
        generateValue: true
      - key: API_TOKEN_SALT
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: TRANSFER_TOKEN_SALT
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true

      - key: DATABASE_CLIENT
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: bmc-postgres
          property: connectionString
      - key: DATABASE_SSL
        value: 'true'
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: 'false'

      # Dominios del front autorizados (CORS). Ajustar tras desplegar en Vercel.
      - key: FRONTEND_URLS
        sync: false

databases:
  - name: bmc-postgres
    plan: free
    databaseName: bmc
    user: bmc
